name: Quote Arc PayLink CCTP funding

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/quote-arc-paylink-cctp.yml

permissions:
  contents: read

jobs:
  quote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested feature branch
        uses: actions/checkout@v7
        with:
          ref: feat/claimable-crosschain-escrow

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Quote and validate balances without transacting
        env:
          ARC_TESTNET_PRIVATE_KEY: ${{ secrets.ARC_TESTNET_PRIVATE_KEY }}
          ARC_TESTNET_RPC_URL: https://rpc.testnet.arc.io
          CCTP_EXECUTE_TRANSFER: "false"
        run: npm run contracts:fund-test-escrow
