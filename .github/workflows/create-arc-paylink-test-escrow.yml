name: Create Arc PayLink test escrow

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/create-arc-paylink-test-escrow.yml

permissions:
  contents: read

concurrency:
  group: arc-paylink-test-escrow
  cancel-in-progress: false

jobs:
  create:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out tested feature branch
        uses: actions/checkout@v7
        with:
          ref: feat/claimable-crosschain-escrow

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test contracts
        run: npm run contracts:test

      - name: Require deployer secret
        env:
          ARC_TESTNET_PRIVATE_KEY: ${{ secrets.ARC_TESTNET_PRIVATE_KEY }}
        run: test -n "$ARC_TESTNET_PRIVATE_KEY"

      - name: Create one-USDC test escrow
        env:
          ARC_TESTNET_PRIVATE_KEY: ${{ secrets.ARC_TESTNET_PRIVATE_KEY }}
          ARC_TESTNET_RPC_URL: https://rpc.testnet.arc.io
        run: npm run contracts:create-test-escrow
