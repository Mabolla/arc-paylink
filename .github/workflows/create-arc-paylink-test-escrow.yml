name: Create and fund Circle recipient escrow

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arc-paylink-circle-recipient-escrow
  cancel-in-progress: false

jobs:
  create-and-fund:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out triggering branch
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test contracts
        run: npm run contracts:test

      - name: Require deployer secret
        env:
          ARC_TESTNET_PRIVATE_KEY: ${{ secrets.ARC_TESTNET_PRIVATE_KEY }}
        run: test -n "$ARC_TESTNET_PRIVATE_KEY"

      - name: Create and fund one-USDC Circle recipient escrow
        env:
          ARC_TESTNET_PRIVATE_KEY: ${{ secrets.ARC_TESTNET_PRIVATE_KEY }}
          ARC_TESTNET_RPC_URL: https://rpc.testnet.arc.io
          ARC_PAYLINK_CLAIM_PUBLIC_KEY: 
        run: npm run contracts:create-fund-circle-escrow

      - name: Preserve encrypted claim package
        uses: actions/upload-artifact@v6
        with:
          name: circle-recipient-escrow
          path: circle-escrow-package.json
          if-no-files-found: error
          retention-days: 7
