name: Verify Arc PayLink CCTP forwarding

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/verify-arc-paylink-cctp.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out tested feature branch
        uses: actions/checkout@v7
        with:
          ref: feat/claimable-crosschain-escrow

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify existing burn and Arc escrow balance
        env:
          ARC_TESTNET_RPC_URL: https://rpc.testnet.arc.io
        run: npm run contracts:verify-test-escrow-funding
