name: Verify Arc mainnet pilot

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/mainnet-microgrants]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_ARC_NETWORK: mainnet
      NEXT_PUBLIC_ARC_PAYLINK_FACTORY_ADDRESS: "0x19fbf0B85e66d68D312cD18D04A1a789107387FF"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
        env:
          NEXT_PUBLIC_ARC_NETWORK: testnet
      - run: npm run build
      - run: npm run contracts:verify:arc-mainnet
      - name: Read-only Arc mainnet preflight
        run: >-
          node -e 'const {createPublicClient,http}=require("viem"); const {arc}=require("viem/chains");
          const abi=[{type:"function",name:"decimals",stateMutability:"view",inputs:[],outputs:[{type:"uint8"}]}];
          (async()=>{const c=createPublicClient({chain:arc,transport:http("https://rpc.mainnet.arc.io")});
          const address="0x3600000000000000000000000000000000000000";
          const chainId=await c.getChainId(); const code=await c.getCode({address});
          const decimals=await c.readContract({address,abi,functionName:"decimals"});
          if(chainId!==5042||code==="0x"||decimals!==6) process.exit(1);
          console.log(JSON.stringify({chainId,address,codePresent:true,decimals}));})().catch(error=>{console.error(error);process.exit(1)})'
